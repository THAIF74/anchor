<!doctype html>
<html>
<head>
    <title>Anchor Dashboard</title>
    <style>
        body { font-family: monospace; background: #0f1115; color: #ddd; margin: 0; padding: 20px; }
        h1 { color: #fff; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        .goal { font-size: 18px; color: #7cc; margin-bottom: 20px; }
        .btn { padding: 10px 20px; font-size: 16px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; margin-right: 10px; }
        .btn.step { background: #388e3c; color: white; }
        .btn.reset { background: #333; color: white; }
        .btn:hover { opacity: 0.8; }
        .memories { display: flex; flex-direction: column; gap: 10px; }
        .memory { border: 1px solid #333; border-radius: 6px; padding: 15px; background: #1a1d24; display: flex; justify-content: space-between; align-items: center; }
        .memory.alert { border-color: #d32f2f; background: #2a1515; color: #ff8a80; }
        .badge { font-size: 12px; padding: 4px 8px; border-radius: 4px; background: #333; }
        .badge.alert { background: #d32f2f; color: white; }
        .step-info { margin-bottom: 20px; color: #888; }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚓ Anchor: State Manager</h1>
        <div>
            <button class="btn step" onclick="takeStep()">▶ Run Next Agent Step</button>
            <button class="btn reset" onclick="resetAgent()">Reset</button>
        </div>
    </div>

    <div class="goal" id="goal">Loading goal...</div>
    <div class="step-info" id="step-info"></div>

    <div class="memories" id="memories"></div>

<script>
    async function fetchState() {
        const res = await fetch('/api/state');
        const data = await res.json();
        
        document.getElementById('goal').innerText = "🎯 Goal: " + data.goal;
        document.getElementById('step-info').innerText = `Current Step: ${data.step} / 6 (Note: Memory limit is 4)`;

        const memDiv = document.getElementById('memories');
        memDiv.innerHTML = "";
        
        data.memories.forEach(m => {
            const isAlert = m.content.includes("SYSTEM ALERT");
            const div = document.createElement('div');
            div.className = "memory" + (isAlert ? " alert" : "");
            div.innerHTML = `
                <div><b>[Step ${m.step}]</b> ${m.content}</div>
                <div class="badge ${isAlert ? 'alert' : ''}">${isAlert ? '⚠️ DRIFT DETECTED' : 'OK'}</div>
            `;
            memDiv.appendChild(div);
        });
    }

    async function takeStep() {
        await fetch('/api/step', { method: 'POST' });
        fetchState();
    }

    async function resetAgent() {
        await fetch('/api/reset', { method: 'POST' });
        fetchState();
    }

    fetchState();
</script>
</body>
</html>
